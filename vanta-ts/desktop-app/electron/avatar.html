<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'">
<title>Vanta avatar</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#202024;font:12px system-ui}
main{margin:4px;padding:6px 8px 8px;background:#f7f7f8;border:1px solid #d8d8dc;border-radius:24px;text-align:center;box-shadow:0 2px 8px #0002}
header{height:20px;position:relative;-webkit-app-region:drag;color:#62626b;font-size:10px;letter-spacing:2px}
button{cursor:pointer;font:inherit;-webkit-app-region:no-drag}button:focus-visible{outline:3px solid #202024;outline-offset:2px}
#hide{position:absolute;right:0;top:-2px;width:24px;height:24px;border:0;border-radius:50%;background:#ededee;color:#51515a;font-size:16px}
#open{display:block;margin:3px auto 6px;width:52px;height:52px;border:0;border-radius:18px;background:#6d28d9;color:white;font-size:26px;font-weight:650}
#phase{display:block;font-size:11px;line-height:16px}body[data-phase="needs-you"] #open{outline:3px solid #a8550a;outline-offset:2px}
</style></head><body><main aria-label="Vanta presence"><header title="Drag to move">···<button id="hide" aria-label="Hide Vanta avatar">×</button></header>
<button id="open" aria-label="Open Mini Vanta" title="Open the same live Vanta workspace">v<span aria-hidden="true">.</span></button>
<span id="phase" role="status">Connecting</span></main><script src="avatar.js"></script></body></html>
