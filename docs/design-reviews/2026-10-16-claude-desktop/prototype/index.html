<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vanta · Chat and Code</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="reference.css"></head>
<body>
<a class="skip" href="#content">Skip to workspace</a>
<div class="app" id="app">
 <aside class="sidebar" aria-label="Vanta navigation">
  <div class="brand"><span class="brand-mark" aria-hidden="true">V</span><strong>Vanta</strong><button class="icon-btn" data-action="search" aria-label="Search workspace">⌕</button><button class="icon-btn" data-action="sidebar" aria-label="Toggle sidebar">◧</button></div>
  <div class="mode-switch" role="group" aria-label="Work mode"><button data-mode="chat">Chat</button><button data-mode="code">⌘ &nbsp;Code</button></div>
  <button class="nav new" data-action="new"><span>＋</span>New<kbd>⌘N</kbd></button>
  <nav class="primary" aria-label="Primary"><button class="nav" data-view="library"><span data-icon="library"></span>Outputs</button><button class="nav" data-view="skills"><span data-icon="settings"></span>Customize</button><button class="nav" data-action="more"><span>···</span>More<span class="count" id="needs-count">1</span></button></nav>
  <div class="project-heading"><span>Projects</span><button class="icon-btn" data-action="project" aria-label="Project options">＋</button></div>
  <nav id="projects" aria-label="Projects and conversations"></nav>
  <div class="sidebar-bottom"><button class="account" data-action="profiles"><span class="avatar" id="profile-initial">D</span><span id="profile-label">Default profile<small>Local profile</small></span><span>⌄</span></button></div>
 </aside>
 <div class="workspace">
  <header class="titlebar"><button class="icon-btn mobile-menu" data-action="sidebar" aria-label="Open navigation">☰</button><div class="mode-switch mobile-mode-switch" role="group" aria-label="Compact work mode"><button data-mode="chat">Chat</button><button data-mode="code">Code</button></div><div class="title-wrap"><button class="session-title" data-action="session-menu"><strong id="title">A better Vanta desktop</strong><span aria-hidden="true">⌄</span></button><span id="project-label" class="muted">Vanta</span></div><span class="status" id="run-status">Unverified</span><div class="pane-buttons" role="group" aria-label="Workspace panels"><button data-panel="overview" aria-label="Task context" data-icon="panel"></button><button data-panel="terminal" aria-label="Terminal" data-icon="terminal"></button><button data-panel="changes" aria-label="Changes" data-icon="diff"></button><button data-panel="browser" aria-label="Browser preview" data-icon="globe"></button><button data-panel="files" aria-label="Files" data-icon="folder"></button></div><button class="icon-btn" data-action="view-options" aria-label="View options">···</button></header>
  <div class="prototype-note"><span>Interactive prototype · sample data</span><button data-action="guide">Try the walkthrough</button></div>
  <div id="connection-banner" hidden class="connection-banner" role="status"></div>
  <div class="body"><main id="content" tabindex="-1"></main><aside id="inspector" class="inspector" aria-label="Task workbench"></aside></div>
  <footer class="runtime"><button data-action="runtime"><span class="dot"></span><span id="connection-text">Local runtime · simulated</span></button><span id="footer-context">Vanta Engine · no live connection</span><button data-action="network" id="network-toggle">Test offline</button></footer>
 </div>
</div>
<dialog id="dialog"><div id="dialog-body"></div></dialog><div id="announcement" class="sr" role="status" aria-live="polite"></div><div class="toast" id="toast" role="status" hidden></div>
<script src="features.js"></script><script src="app.js"></script>
</body></html>
